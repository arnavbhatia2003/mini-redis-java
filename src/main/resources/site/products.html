<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>All products · Cachet</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23101114'/%3E%3Crect x='4' y='4' width='8' height='8' fill='%23f07a1a'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/shop.css">
</head>
<body data-page="list">
<header id="site-header"></header>

<main class="wrap">
  <div class="list-head">
    <div>
      <span class="mono" style="color:var(--ink-3)" id="list-kicker">The whole catalogue</span>
      <h1 class="display" id="list-title">All products</h1>
    </div>
    <div class="list-tools">
      <label class="field"><span class="mono">Find</span><input id="search" type="search" placeholder="blue, lamp, travel" autocomplete="off"></label>
      <label class="field"><span class="mono">Sort</span>
        <select id="sort">
          <option value="rank">Bestselling</option>
          <option value="low">Price, low to high</option>
          <option value="high">Price, high to low</option>
          <option value="name">Name</option>
        </select>
      </label>
    </div>
  </div>
  <div class="list-count"><span id="count">Loading products</span><span class="mono">Ranked by revenue across every order</span></div>
  <div class="grid" id="grid"></div>
</main>

<footer id="site-footer"></footer>
<script src="/shop.js"></script>
</body>
</html>
